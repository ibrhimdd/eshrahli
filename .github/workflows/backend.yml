name: Backend checks

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: backend
        run: npm install
      - name: Check syntax
        working-directory: backend
        run: npm run check

      - name: Check frontend JavaScript syntax
        run: |
          node --check --input-type=module < frontend/firebase-client.js
          node -e 'const fs=require("node:fs"); const vm=require("node:vm"); const html=fs.readFileSync("frontend/index.html","utf8"); for (const match of html.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)) new vm.Script(match[1]);'
      - name: Run API tests
        working-directory: backend
        run: npm test
