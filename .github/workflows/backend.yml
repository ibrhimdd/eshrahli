name: Backend checks

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: backend
        run: npm install
      - name: Check syntax
        working-directory: backend
        run: npm run check

      - name: Check frontend JavaScript syntax
        run: |
          node --check --input-type=module < frontend/firebase-client.js
          node -e 'const fs=require("node:fs"); const vm=require("node:vm"); const html=fs.readFileSync("frontend/index.html","utf8"); const start=html.indexOf("<script>"); const end=html.indexOf("</script>", start); if (start < 0 || end < 0) process.exit(1); new vm.Script(html.slice(start + 8, end));'
      - name: Run API tests
        working-directory: backend
        run: npm test

