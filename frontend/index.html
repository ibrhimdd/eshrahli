<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اشرحلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: header / scrollable zoomable whiteboard canvas / bottom composer bar. Light = whiteboard, dark = chalkboard. */
:root{
  --bg:#FBF8F1; --board:#FFFFFF; --panel:#FFFFFF;
  --ink:#2B2A28; --ink-soft:#80796C;
  --accent:#F2A33C; --accent-ink:#4A2E05;
  --line:#3D6B8A; --line-soft:#5F8FAD;
  --grid:#E9E2D2; --shadow:rgba(43,42,40,0.14);
  --danger:#B14A3B;
  --font-ink:'Aref Ruqaa',serif; --font-ui:'Tajawal','Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131418; --board:#1E2027; --panel:#1E2027;
    --ink:#ECE7DA; --ink-soft:#948F82;
    --accent:#F2B705; --accent-ink:#2B1E02;
    --line:#6FB7D9; --line-soft:#4C8AAC;
    --grid:#2A2D35; --shadow:rgba(0,0,0,0.45);
    --danger:#E07A66;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131418; --board:#1E2027; --panel:#1E2027;
  --ink:#ECE7DA; --ink-soft:#948F82;
  --accent:#F2B705; --accent-ink:#2B1E02;
  --line:#6FB7D9; --line-soft:#4C8AAC;
  --grid:#2A2D35; --shadow:rgba(0,0,0,0.45);
  --danger:#E07A66;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);overflow:hidden}
img{max-width:100%}
.app{display:flex;flex-direction:column;height:100%}

.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding-block:12px; padding-right:max(16px,env(safe-area-inset-right,0px)); padding-left:max(16px,env(safe-area-inset-left,0px));
  border-bottom:1px solid var(--grid); flex:0 0 auto;
}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
#modelSelect{max-width:210px;padding:7px 10px;border:1px solid var(--grid);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;font-size:12px}
.brand-icon{font-size:20px;line-height:1}
.brand-name{font-family:var(--font-ink);font-weight:700;font-size:22px;white-space:nowrap}
.badge{
  font-size:11px;color:var(--ink-soft);background:transparent;border:1px solid var(--grid);
  padding:4px 10px;border-radius:999px;white-space:nowrap;flex:0 0 auto;
}
@media (max-width:480px){ .badge{display:none} #modelSelect{max-width:145px;font-size:11px} }

.board-wrap{position:relative;flex:1;min-height:0;background:var(--board)}
.board-scroll{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
#board{display:block}
.pen-cursor{font-size:30px;opacity:0;pointer-events:none;text-anchor:middle;dominant-baseline:central;transition:opacity .15s}

.empty-state{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;text-align:center;padding:24px;background:var(--board);
}
.empty-state p{max-width:360px;color:var(--ink-soft);font-size:15px;line-height:1.7;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:420px}
.chip{
  font-family:var(--font-ui);font-size:13px;color:var(--line);background:transparent;
  border:1.5px solid var(--line-soft);padding:8px 14px;border-radius:999px;cursor:pointer;
}
.chip:hover{background:var(--line);color:var(--board)}
.chip:focus-visible,.icon-btn:focus-visible,.send-btn:focus-visible,.zoom-controls button:focus-visible{outline:2px solid var(--line);outline-offset:2px}

.zoom-controls{
  position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;
  display:flex;flex-direction:column;gap:6px;z-index:5;
}
.zoom-controls button{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--grid);background:var(--panel);
  color:var(--ink);font-size:16px;cursor:pointer;box-shadow:0 2px 6px var(--shadow);
}
.skip-btn{
  position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;z-index:5;
  font-family:var(--font-ui);font-size:12px;color:var(--ink-soft);background:var(--panel);
  border:1px solid var(--grid);padding:7px 12px;border-radius:999px;cursor:pointer;box-shadow:0 2px 6px var(--shadow);
}
.skip-btn[hidden]{display:none}

.composer{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding-block:10px; padding-right:max(16px,env(safe-area-inset-right,0px)); padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-bottom:max(10px,env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--grid);background:var(--panel);
}
.icon-btn{
  flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--grid);
  background:transparent;font-size:16px;cursor:pointer;color:var(--ink-soft);
}
#topicInput{
  flex:1;min-width:0;font-family:var(--font-ui);font-size:15px;color:var(--ink);
  background:var(--bg);border:1px solid var(--grid);border-radius:999px;padding:10px 16px;
}
#topicInput:disabled{opacity:.6}
.send-btn{
  flex:0 0 auto;font-family:var(--font-ui);font-weight:700;font-size:14px;
  background:var(--line);color:#fff;border:none;border-radius:999px;padding:10px 18px;cursor:pointer;
}
.send-btn:disabled{opacity:.5;cursor:not-allowed}
.hint{font-size:11px;color:var(--ink-soft);text-align:center;padding:0 16px 8px;margin:0}

@media (max-width:480px){
  .brand-name{font-size:19px}
  #topicInput{font-size:14px}
  .send-btn{padding:10px 14px;font-size:13px}
}
</style>
</head>
<body>
<div class="app" dir="rtl">
  <header class="topbar">
    <div class="brand"><span class="brand-icon">✏️</span><span class="brand-name">اشرحلي</span></div>
    <span class="badge">مدرسك الذكي · سبورة تفاعلية</span><select id="modelSelect" aria-label="اختيار نموذج الذكاء الاصطناعي"><option value="openrouter/free">اختيار تلقائي (مجاني)</option></select>
  </header>

  <div class="board-wrap" id="boardWrap">
    <div class="board-scroll" id="boardScroll">
      <svg id="board" viewBox="0 0 1000 1000" width="1000" style="width:1000px;height:auto" role="img" aria-label="سبورة بيضاء تعرض خريطة ذهنية متحركة للموضوع المطلوب"></svg>
    </div>

    <div class="empty-state" id="emptyState">
      <p>اكتب أي موضوع بتذاكره تحت، وهتلاقي السبورة بترسملك خريطة ذهنية بالخط اليدوي خطوة بخطوة — زي فكرة Knowie بالظبط.</p>
      <div class="chips">
        <button class="chip" type="button" data-topic="mirrors">المرايا في الفيزياء</button>
        <button class="chip" type="button" data-topic="blood">الدورة الدموية</button>
        <button class="chip" type="button" data-topic="revolution">الثورة الفرنسية</button>
        <button class="chip" type="button" data-topic="photosynthesis">التمثيل الضوئي</button>
      </div>
    </div>

    <button class="skip-btn" id="skipBtn" hidden type="button">تخطي الرسم ⏭</button>
    <div class="zoom-controls">
      <button id="zoomIn" type="button" title="تكبير">+</button>
      <button id="zoomOut" type="button" title="تصغير">−</button>
      <button id="resetBoard" type="button" title="سبورة جديدة">↺</button>
    </div>
  </div>

  <p class="hint" id="hint" hidden>المواضيع الأربعة الجاهزة بترسم فورًا. أي موضوع تاني بيتبعت لسيرفر الباك إند، ولو مفيش مفتاح ذكاء اصطناعي متظبط هيرجع خريطة عامة بديلة.</p>
  <form class="composer" id="composer">
    <button type="button" class="icon-btn" title="تسجيل صوتي (شكلي في الديمو)">🎙️</button>
    <button type="button" class="icon-btn" title="إرفاق صورة (شكلي في الديمو)">📷</button>
    <input id="topicInput" type="text" placeholder="اكتب موضوعك هنا... مثلاً: التمثيل الضوئي" autocomplete="off" maxlength="60">
    <button type="submit" class="send-btn" id="sendBtn">ابدأ الشرح</button>
  </form>
</div>

<script>
(function(){
  "use strict";

  // Backend base URL. Override by setting window.ESHRAHLI_API_BASE before this script runs,
  // or just edit the default below once you deploy the backend somewhere other than localhost.
  var API_BASE = (window.ESHRAHLI_API_BASE || "http://localhost:4000").replace(/\/$/, "");
  var selectedModel = "openrouter/free";
  var modelSelect = document.getElementById("modelSelect");
  async function loadModels(){
    if (!modelSelect) return;
    try {
      var response = await fetch(API_BASE + "/api/models");
      if (!response.ok) throw new Error("models unavailable");
      var payload = await response.json();
      (payload.models || []).forEach(function(model){
        var option = document.createElement("option");
        option.value = model.id; option.textContent = model.name + " · مجاني";
        modelSelect.appendChild(option);
      });
    } catch (error) { console.warn("تعذر تحميل النماذج؛ سيظل الاختيار التلقائي متاحًا.", error); }
  }
  if (modelSelect) modelSelect.addEventListener("change", function(){ selectedModel = modelSelect.value; });
  loadModels();

  var TOPICS = {
    mirrors: {
      title: "المرايا في الفيزياء",
      branches: [
        { label: "أنواع المرايا", highlight: true, children: ["مستوية", "مقعرة", "محدبة"] },
        { label: "تكوين الصورة", children: ["صورة حقيقية", "صورة خيالية"] },
        { label: "القوانين", children: ["قانون العاكس", "البعد البؤري"] },
        { label: "الاستخدامات", children: ["المرايا الجانبية", "التلسكوبات"] }
      ]
    },
    blood: {
      title: "الدورة الدموية",
      branches: [
        { label: "القلب", highlight: true, children: ["الأذينان", "البطينان"] },
        { label: "الأوعية الدموية", children: ["الشرايين", "الأوردة", "الشعيرات"] },
        { label: "مكونات الدم", children: ["كرات حمراء", "كرات بيضاء", "صفائح دموية"] },
        { label: "الوظيفة", children: ["نقل الأكسجين", "نقل الغذاء"] }
      ]
    },
    revolution: {
      title: "الثورة الفرنسية",
      branches: [
        { label: "الأسباب", children: ["الأزمة الاقتصادية", "الفوارق الطبقية"] },
        { label: "أهم الأحداث", highlight: true, children: ["سقوط الباستيل", "إعدام الملك"] },
        { label: "النتائج", children: ["إعلان حقوق الإنسان", "صعود نابليون"] }
      ]
    },
    photosynthesis: {
      title: "التمثيل الضوئي",
      branches: [
        { label: "المدخلات", children: ["الماء", "ثاني أكسيد الكربون", "ضوء الشمس"] },
        { label: "مراحل العملية", highlight: true, children: ["التفاعلات الضوئية", "دورة كالفن"] },
        { label: "المخرجات", children: ["الأكسجين", "الجلوكوز"] }
      ]
    }
  };

  var KEYWORDS = [
    [["مراي", "مرايا", "انعكاس"], "mirrors"],
    [["دم", "قلب", "الدوره الدمويه", "دموي"], "blood"],
    [["ثور", "فرنس", "باستيل"], "revolution"],
    [["ضوئي", "تمثيل", "نبات", "كلوروفيل"], "photosynthesis"]
  ];

  function buildGeneric(topic){
    return {
      title: topic,
      generic: true,
      branches: [
        { label: "التعريف", children: ["المفهوم الأساسي"] },
        { label: "الأنواع", highlight: true, children: ["النوع الأول", "النوع الثاني"] },
        { label: "أمثلة", children: ["مثال تطبيقي"] },
        { label: "الأهمية", children: ["ليه بندرسه"] }
      ]
    };
  }

  function matchKeyword(text){
    var clean = (text || "").trim();
    for (var i = 0; i < KEYWORDS.length; i++){
      var words = KEYWORDS[i][0];
      for (var j = 0; j < words.length; j++){
        if (clean.indexOf(words[j]) !== -1){
          var data = TOPICS[KEYWORDS[i][1]];
          return { title: data.title, branches: data.branches };
        }
      }
    }
    return null;
  }

  function isValidMindMap(data){
    return !!data && typeof data.title === "string" && Array.isArray(data.branches) &&
      data.branches.length > 0 && data.branches.every(function(b){
        return typeof b.label === "string" && Array.isArray(b.children);
      });
  }

  async function resolveTopic(text){
    var local = matchKeyword(text);
    if (local) return local;
    try {
      var res = await fetch(API_BASE + "/api/mindmap", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ topic: text, model: selectedModel })
      });
      if (!res.ok) throw new Error("bad response " + res.status);
      var data = await res.json();
      if (!isValidMindMap(data)) throw new Error("bad shape from backend");
      return data;
    } catch (err){
      console.error("اشرحلي: تعذر إنشاء الخريطة.", err);
      throw new Error("تعذر الاتصال بالمدرس الذكي. تأكد من تشغيل الـ API وإعداد مفتاح OpenRouter، ثم حاول مرة أخرى.");
    }
  }

  // ---------- layout ----------
  var CX = 500, CY = 430;
  var R1 = 190, R2 = 350;

  function layout(data){
    var n = data.branches.length;
    var startAngle = -90;
    var step = 360 / n;
    data.branches.forEach(function(b, i){
      var angle = startAngle + i * step;
      var rad = angle * Math.PI / 180;
      b.x = CX + R1 * Math.cos(rad);
      b.y = CY + R1 * Math.sin(rad);
      var children = b.children || [];
      var m = children.length;
      var spread = 34;
      b.kids = children.map(function(label, j){
        var off = m > 1 ? (j - (m - 1) / 2) * (spread / (m - 1)) : 0;
        var cAngle = angle + off;
        var cRad = cAngle * Math.PI / 180;
        return { label: label, x: CX + R2 * Math.cos(cRad), y: CY + R2 * Math.sin(cRad) };
      });
    });
    return data;
  }

  // ---------- svg helpers ----------
  var SVGNS = "http://www.w3.org/2000/svg";
  function el(tag, attrs){
    var e = document.createElementNS(SVGNS, tag);
    for (var k in attrs){ e.setAttribute(k, attrs[k]); }
    return e;
  }
  function boxSize(text, kind){
    var len = text.length;
    if (kind === "center") return { w: clamp(170, len * 15 + 70, 320), h: 78 };
    if (kind === "branch") return { w: clamp(120, len * 13 + 50, 250), h: 58 };
    return { w: clamp(90, len * 12 + 36, 190), h: 44 };
  }
  function clamp(min, v, max){ return Math.max(min, Math.min(max, v)); }

  // ---------- board state ----------
  var board = document.getElementById("board");
  var pen = null;
  var skipBtn = document.getElementById("skipBtn");
  var fastForward = false;
  var drawing = false;
  var followupCount = 0;
  var FOLLOWUP_SLOTS = [[340, 940], [500, 970], [660, 940]];

  function clearBoard(){
    while (board.firstChild) board.removeChild(board.firstChild);
    var defs = el("defs", {});
    var pattern = el("pattern", { id: "dotgrid", width: 28, height: 28, patternUnits: "userSpaceOnUse" });
    pattern.appendChild(el("circle", { cx: 2, cy: 2, r: 1.3, fill: "var(--grid)" }));
    defs.appendChild(pattern);
    board.appendChild(defs);
    board.appendChild(el("rect", { x: 0, y: 0, width: 1000, height: 1000, fill: "url(#dotgrid)" }));
    pen = el("text", { x: -100, y: -100, class: "pen-cursor" });
    pen.textContent = "✏️";
    board.appendChild(pen);
    followupCount = 0;
  }

  function setPen(x, y, visible){
    pen.setAttribute("x", x);
    pen.setAttribute("y", y - 14);
    pen.style.opacity = visible ? "1" : "0";
  }

  function wait(ms){
    return new Promise(function(resolve){
      if (fastForward) return resolve();
      setTimeout(resolve, ms);
    });
  }

  function drawLine(x1, y1, x2, y2, color, duration){
    return new Promise(function(resolve){
      var line = el("line", { x1: x1, y1: y1, x2: x1, y2: y1, stroke: color, "stroke-width": 2.5, "stroke-linecap": "round" });
      board.insertBefore(line, pen);
      if (fastForward){
        line.setAttribute("x2", x2); line.setAttribute("y2", y2);
        return resolve();
      }
      var start = null;
      function frame(ts){
        if (!start) start = ts;
        var t = Math.min(1, (ts - start) / duration);
        if (fastForward) t = 1;
        var cx = x1 + (x2 - x1) * t;
        var cy = y1 + (y2 - y1) * t;
        line.setAttribute("x2", cx);
        line.setAttribute("y2", cy);
        setPen(cx, cy, true);
        if (t < 1) requestAnimationFrame(frame);
        else { setPen(cx, cy, false); resolve(); }
      }
      requestAnimationFrame(frame);
    });
  }

  function drawNode(node, kind, color, textColor, fill){
    return new Promise(function(resolve){
      var size = boxSize(node.label, kind);
      node.w = size.w; node.h = size.h;
      var group = el("g", { opacity: 0 });
      var rect, perim;
      if (kind === "child"){
        rect = el("rect", {
          x: node.x - size.w / 2, y: node.y - size.h / 2, width: size.w, height: size.h,
          rx: size.h / 2, ry: size.h / 2, fill: fill, stroke: color, "stroke-width": 1.8
        });
      } else {
        rect = el("rect", {
          x: node.x - size.w / 2, y: node.y - size.h / 2, width: size.w, height: size.h,
          rx: 14, ry: 14, fill: fill, stroke: color, "stroke-width": kind === "center" ? 2.4 : 2
        });
      }
      perim = 2 * (size.w + size.h);
      rect.setAttribute("stroke-dasharray", perim);
      rect.setAttribute("stroke-dashoffset", fastForward ? 0 : perim);
      group.appendChild(rect);

      var text = el("text", {
        x: node.x, y: node.y, "text-anchor": "middle", "dominant-baseline": "central",
        fill: textColor, "font-family": "var(--font-ink)",
        "font-size": kind === "center" ? 26 : (kind === "branch" ? 19 : 15),
        "font-weight": kind === "center" ? 700 : 400
      });
      text.textContent = node.label;
      group.appendChild(text);
      board.insertBefore(group, pen);

      requestAnimationFrame(function(){
        group.style.transition = "opacity .35s ease";
        group.style.opacity = "1";
        rect.style.transition = fastForward ? "none" : "stroke-dashoffset .5s ease";
        requestAnimationFrame(function(){ rect.setAttribute("stroke-dashoffset", 0); });
      });
      wait(fastForward ? 0 : 420).then(resolve);
    });
  }

  function demoNote(text){
    var t = el("text", {
      x: CX, y: CY + 70, "text-anchor": "middle", fill: "var(--ink-soft)",
      "font-family": "var(--font-ui)", "font-size": 12
    });
    t.textContent = text;
    board.insertBefore(t, pen);
  }

  async function animateBoard(data){
    drawing = true;
    skipBtn.hidden = false;
    fastForward = false;
    clearBoard();
    layout(data);

    var center = { x: CX, y: CY, label: data.title };
    await drawNode(center, "center", "var(--ink)", "var(--ink)", "var(--board)");
    if (data.generic) demoNote("محتوى تجريبي لتوضيح شكل الفكرة");
    await wait(250);

    for (var i = 0; i < data.branches.length; i++){
      var b = data.branches[i];
      await drawLine(CX, CY, b.x, b.y, "var(--line-soft)", 450);
      var fill = b.highlight ? "var(--accent)" : "var(--board)";
      var txt = b.highlight ? "var(--accent-ink)" : "var(--ink)";
      await drawNode(b, "branch", "var(--line)", txt, fill);
      await wait(150);
      for (var j = 0; j < b.kids.length; j++){
        var k = b.kids[j];
        await drawLine(b.x, b.y, k.x, k.y, "var(--line-soft)", 320);
        await drawNode(k, "child", "var(--line-soft)", "var(--ink-soft)", "var(--board)");
        await wait(100);
      }
      await wait(150);
    }

    setPen(0, 0, false);
    skipBtn.hidden = true;
    drawing = false;
  }

  async function addFollowup(text){
    if (followupCount >= FOLLOWUP_SLOTS.length) return;
    var slot = FOLLOWUP_SLOTS[followupCount];
    followupCount++;
    var thinking = el("text", {
      x: slot[0], y: slot[1] - 36, "text-anchor": "middle", fill: "var(--ink-soft)",
      "font-family": "var(--font-ui)", "font-size": 13
    });
    thinking.textContent = "بيفكر...";
    board.insertBefore(thinking, pen);
    await wait(500);
    board.removeChild(thinking);
    await drawLine(CX, CY, slot[0], slot[1], "var(--line-soft)", 380);
    var node = { x: slot[0], y: slot[1], label: text.length > 22 ? text.slice(0, 22) + "…" : text };
    await drawNode(node, "branch", "var(--line)", "var(--ink)", "var(--board)");
  }

  // ---------- UI wiring ----------
  var emptyState = document.getElementById("emptyState");
  var hint = document.getElementById("hint");
  var composer = document.getElementById("composer");
  var input = document.getElementById("topicInput");
  var sendBtn = document.getElementById("sendBtn");

  var hasDrawnOnce = false;

  function startTopic(data){
    emptyState.hidden = true;
    hint.hidden = true;
    animateBoard(data).then(function(){
      hasDrawnOnce = true;
      input.placeholder = "اطرح سؤالاً متابعًا عن الخريطة...";
      sendBtn.textContent = "اسأل";
    });
  }

  async function startWithText(text){
    input.disabled = true; sendBtn.disabled = true;
    var prevLabel = sendBtn.textContent;
    sendBtn.textContent = "بيفكر...";
    try {
      var data = await resolveTopic(text);
      startTopic(data);
    } catch (err) {
      alert(err.message || "حدث خطأ أثناء الشرح.");
    } finally {
      input.disabled = false; sendBtn.disabled = false;
      sendBtn.textContent = prevLabel;
    }
  }

  document.querySelectorAll(".chip").forEach(function(chip){
    chip.addEventListener("click", function(){
      var key = chip.getAttribute("data-topic");
      var t = TOPICS[key];
      input.value = chip.textContent;
      startTopic({ title: t.title, branches: t.branches });
    });
  });

  composer.addEventListener("submit", function(e){
    e.preventDefault();
    if (drawing) return;
    var val = input.value.trim();
    if (!val) return;

    if (!hasDrawnOnce){
      startWithText(val);
    } else {
      if (followupCount >= FOLLOWUP_SLOTS.length){
        input.placeholder = "جرب سبورة جديدة من زر ↺";
        input.value = "";
        return;
      }
      addFollowup(val);
    }
    input.value = "";
  });

  skipBtn.addEventListener("click", function(){ fastForward = true; });

  document.getElementById("resetBoard").addEventListener("click", function(){
    fastForward = true;
    drawing = false;
    hasDrawnOnce = false;
    followupCount = 0;
    clearBoard();
    emptyState.hidden = false;
    hint.hidden = false;
    input.placeholder = "اكتب موضوعك هنا... مثلاً: التمثيل الضوئي";
    sendBtn.textContent = "ابدأ الشرح";
    input.value = "";
  });

  var zoom = 1;
  function applyZoom(){
    zoom = clamp(0.6, zoom, 2);
    board.style.width = (1000 * zoom) + "px";
    board.style.height = "auto";
  }
  document.getElementById("zoomIn").addEventListener("click", function(){ zoom += 0.2; applyZoom(); });
  document.getElementById("zoomOut").addEventListener("click", function(){ zoom -= 0.2; applyZoom(); });

  clearBoard();
})();
</script>
</body>
</html>
